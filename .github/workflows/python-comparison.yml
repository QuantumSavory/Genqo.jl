name: Python Comparison Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/legacy/**"
      - "test/python/**"
      - "test/genqo_old_pkg/**"
      - "python/**"
      - ".github/workflows/python-comparison.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/legacy/**"
      - "test/python/**"
      - "test/genqo_old_pkg/**"
      - "python/**"
      - ".github/workflows/python-comparison.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  python-comparison-tests:
    name: Python Comparison Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write # lets julia-actions/cache prune old caches it created
      contents: read
    env:
      PYTHON_JULIACALL_HANDLE_SIGNALS: "yes"
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"

      - uses: julia-actions/cache@v3

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: julia-actions/julia-buildpkg@v1

      - name: Install Python packages
        run: |
          pip install -e "python/[test]"
          pip install -e test/genqo_old_pkg

      - name: Run comparison tests
        run: pytest test/python/test_compare_with_python.py
